<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D0D0F">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>مركز التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0D0F;--card:rgba(28,28,32,.72);--solid:#17171A;--line:#26262B;--soft:#1E1E22;--ink:#EDEDF0;--muted:#8E8E96;--faint:#6A6A72;--blue:#C9D1DA;--blue2:#3A4450;--steel:#4E5A66;--amber:#E0A458;--red:#E8746C;--redbg:rgba(232,116,108,.07);--redline:rgba(232,116,108,.45);--glass:blur(18px) saturate(1.2)}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:15px/1.6 "Readex Pro",system-ui,sans-serif}
html{min-height:100%;background:#0D0D0F}
body{min-height:100vh;background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(1200px 700px at 85% -10%,rgba(78,90,102,.38),transparent 60%),
  radial-gradient(900px 600px at -10% 110%,rgba(58,68,80,.35),transparent 60%),
  linear-gradient(160deg,#0B0B0D 0%,#121318 55%,#0B0B0D 100%)}
[hidden]{display:none!important}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:rgba(201,209,218,.3)}
.btn{height:38px;padding:0 16px;border-radius:5px;border:1px solid #34343A;background:rgba(38,38,43,.7);font-size:14px;font-weight:500;white-space:nowrap;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{background:rgba(52,52,58,.85);border-color:#4A4A52}
.btn.primary{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.primary:hover{background:#5D6B79}
.btn.danger{border-color:var(--redline);color:var(--red)}
.btn.sm{height:32px;font-size:13px;padding:0 12px}
.link{border:0;background:none;color:var(--blue);font-size:13px;padding:0}
input,select,textarea{background:rgba(13,13,15,.75);border:1px solid #34343A;border-radius:5px;padding:9px 12px;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:0}
select option{background:#17171A}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.err{color:var(--red);min-height:1.2em;font-size:13px}
.ltr{direction:ltr;unicode-bidi:isolate}
/* brand */
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:17px;font-weight:600;letter-spacing:.3px;line-height:1.2}
.brand small{display:block;font-size:9.5px;letter-spacing:2.4px;color:var(--muted);direction:ltr;text-align:right}
/* auth */
.auth{max-width:380px;margin:12vh auto;padding:28px;display:grid;gap:12px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:8px}
.auth .brand{justify-content:center;margin-bottom:6px}
.auth h1{margin:0 0 4px;font-size:22px;font-weight:600;text-align:center}
.auth img{width:200px;height:200px;margin:0 auto;background:#fff;border-radius:6px;padding:8px}
.auth code{font-size:12px;text-align:center;word-break:break-all;color:var(--muted)}
#mfaCode{text-align:center;letter-spacing:8px;font-size:20px}
/* shell */
.wrap{max-width:1240px;margin:0 auto;padding:20px 22px 64px}
header.topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:10px 14px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:8px;position:sticky;top:12px;z-index:5}
header.topbar h1{font-size:18px;font-weight:600;margin:0;flex:1}
header.topbar h1 a{color:inherit}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px;display:inline-block}
h2{font-size:26px;font-weight:600;margin:0}
h3{font-size:16px;font-weight:600;margin:0}
.lead{font-size:18px;font-weight:300;line-height:1.7;margin:8px 0 22px;max-width:900px;color:#C8C8CE}
.lead b{font-weight:600;color:var(--ink)}
.panel{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.panel .sub{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec{margin-top:18px}
/* totals */
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 22px}
.totals div{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:8px;padding:14px 18px}
.totals b{display:block;font-size:28px;font-weight:600;line-height:1.2}
.totals span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
/* status shapes: filled = active, hollow = inactive, square = stopped */
.dot{display:inline-block;width:9px;height:9px;flex:none}
.dot.a{border-radius:2px;background:#7FD3A5}
.dot.i{border-radius:2px;border:2px solid var(--faint)}
.dot.s{background:var(--red)}
/* app cards */
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
.app{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;gap:16px;color:var(--ink);text-align:start;cursor:pointer;transition:border-color .15s,background .15s}
.app:hover{border-color:#4A4A52;background:rgba(36,36,41,.8)}
.logo{width:132px;flex:none;border-radius:6px;background:rgba(13,13,15,.6);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:10px;min-height:76px}
.logo img{max-width:100%;max-height:48px;object-fit:contain}
.logo span{font-size:16px;font-weight:600;color:var(--ink);text-align:center;line-height:1.2;letter-spacing:.5px}
.app .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.app .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.app .hd b{font-size:16px;font-weight:600;display:block}
.app .hd small{font-size:12.5px;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:rgba(13,13,15,.55);border:1px solid var(--soft);border-radius:5px;padding:8px 10px}
.trio b{display:block;font-size:19px;font-weight:600;line-height:1.2}
.trio span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.offline{border:1px dashed #34343A;border-radius:5px;padding:10px 12px;font-size:13px;color:var(--muted)}
/* app page */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.top .logo{width:150px;min-height:70px;position:relative}
.top .ttl{flex:1;min-width:220px}
.top .ttl small{font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.chart{display:flex;gap:8px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--faint);padding-bottom:38px;min-width:16px;text-align:left}
.plot{flex:1;position:relative;height:210px}
.grid{position:absolute;inset:0 0 38px 0;display:flex;flex-direction:column;justify-content:space-between}
.grid i{display:block;border-top:1px dashed #2C2C31}
.bars{position:absolute;inset:0;display:flex;gap:5px;align-items:flex-end}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar b{font-size:12px;font-weight:600;margin-bottom:3px}
.bar i{display:block;width:100%;max-width:26px;border-radius:2px 2px 0 0;background:var(--blue2)}
.bar.today i{background:var(--blue)}
.bar small{height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:var(--faint);line-height:1.3}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
/* service rows */
.svc{border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:210px 1fr 110px;gap:18px;align-items:center;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.svc.danger{border-color:var(--redline);background:var(--redbg)}
.svc.compact{grid-template-columns:1fr 90px;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0;background:none;backdrop-filter:none}
.svc.compact .mid{grid-column:1/-1;order:3}
.svc .nm b{display:block;font-size:15px;font-weight:600}
.svc .nm span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.co{border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(13,13,15,.5)}
.co.off{opacity:.55}
.co .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.code{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:4px;border:1px solid #34343A;background:rgba(13,13,15,.6);font-family:ui-monospace,Consolas,monospace;font-size:14px;letter-spacing:.14em;direction:ltr}
.code.off{opacity:.55}.code.off b{text-decoration:line-through}.code b{font-weight:600}
.code button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:12px;padding:2px 4px;letter-spacing:0;font-family:inherit}
.code button:hover{color:var(--ink)}
.chip{height:22px;padding:0 8px;border-radius:4px;border:1px solid #34343A;background:rgba(13,13,15,.6);font-size:11.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mid{display:flex;flex-direction:column;gap:7px}
.use{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.use b{color:var(--ink);font-weight:600}
.track{position:relative;height:10px;background:#1E1E22;border-radius:2px}
.track i{position:absolute;top:0;bottom:0;right:0;border-radius:2px}
.track .t{position:absolute;top:-5px;width:3px;height:20px;background:var(--ink);border-radius:1px}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}
.left{text-align:center}
.left b{display:block;font-size:26px;font-weight:600;line-height:1.1}
.left span{font-size:12px;color:var(--muted)}
.sum{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.sum div{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:6px;padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:14px}
.sum b{font-size:22px;font-weight:600}
.key{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--muted);margin-bottom:18px}
.key span{display:flex;align-items:center;gap:6px}
.grp{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.grp h3 small{font-size:13px;font-weight:400;color:var(--muted);margin-inline-start:8px}
/* accounts */
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.acc{border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;text-align:start;background:rgba(13,13,15,.5);cursor:pointer;color:var(--ink)}
.acc:hover{border-color:#4A4A52}
.acc .r{display:flex;justify-content:space-between;gap:8px}
.acc b{font-size:14.5px;font-weight:600}
/* devices */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.flt{height:34px;padding:0 14px;border-radius:5px;border:1px solid #34343A;background:rgba(28,28,32,.7);font-size:13.5px;display:flex;align-items:center;gap:7px;color:var(--ink)}
.flt.on{background:var(--ink);border-color:var(--ink);color:#0D0D0F}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:start;color:var(--ink);font-size:14px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#4A4A52}
.card.stopped{border-color:var(--redline)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ch b{font-size:16px;font-weight:600;display:block}
.ch small{font-size:12px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:4px;background:rgba(13,13,15,.6);border:1px solid #2C2C31;white-space:nowrap}
.nums{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:5px;background:rgba(13,13,15,.45)}
.nums div{padding:9px 4px;text-align:center}
.nums div+div{border-inline-start:1px solid var(--line)}
.nums b{display:block;font-size:15px;font-weight:600}
.nums span{font-size:11.5px;color:var(--muted)}
.meta{display:flex;flex-direction:column;gap:4px;font-size:13px}
.meta div{display:flex;justify-content:space-between;gap:10px}
.meta span{color:var(--muted)}
.more{font-size:12.5px;color:var(--blue);font-weight:500}
/* BGX: PCs and their licenses */
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(13,13,15,.5)}
.pc .r{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc b{font-size:15px;font-weight:600}
.lic{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:4px;border:1px solid #34343A;white-space:nowrap}
.lic.pro{background:rgba(127,211,165,.1);border-color:rgba(127,211,165,.4);color:#9FE0BD}
.lic.trial{background:rgba(224,164,88,.1);border-color:rgba(224,164,88,.4);color:#EBC08A}
.lic.free{background:rgba(13,13,15,.6);color:var(--muted)}
.lic.blocked{background:var(--redbg);border-color:var(--redline);color:var(--red)}
.pc .acts2{display:flex;flex-wrap:wrap;gap:6px}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:8px;padding:0;width:min(560px,94vw);color:var(--ink);background:rgba(23,23,26,.92);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog.wide{width:min(780px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.dlg{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dh h3{font-size:20px}
.x{width:36px;height:36px;border-radius:5px;border:1px solid #34343A;background:rgba(38,38,43,.7);font-size:15px;flex:none;color:var(--ink)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:rgba(13,13,15,.45)}
.box h4{margin:0 0 2px;font-size:14px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.kv span:first-child{color:var(--muted)}
.ev{display:flex;gap:10px;font-size:13.5px}
.ev i{width:9px;height:9px;border-radius:2px;border:2px solid var(--blue);margin-top:7px;flex:none}
.wk{display:flex;align-items:flex-end;gap:6px;height:64px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:flex-end;height:100%}
.wk i{display:block;width:100%;max-width:22px;background:var(--blue);border-radius:2px 2px 0 0}
.wk small{font-size:10px;color:var(--faint)}
.acts{display:flex;flex-wrap:wrap;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.form{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.check input{width:auto}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed #34343A;border-radius:8px}
@media(max-width:860px){.two,.mg,.row2{grid-template-columns:1fr}.totals{grid-template-columns:repeat(2,1fr)}.apps{grid-template-columns:1fr}.svc{grid-template-columns:1fr}.svc .left{text-align:start}}
@media(max-width:520px){.app{flex-direction:column}.logo{width:100%}}
@media(display-mode:standalone){header.topbar{top:8px}}
</style>
</head>
<body>

<section class="auth" id="login" hidden>
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="8" fill="#1E1E22"/><rect x="11" y="11" width="19" height="19" rx="2" fill="#4E5A66"/><rect x="34" y="11" width="19" height="19" rx="2" fill="#8C99A6"/><rect x="11" y="34" width="19" height="19" rx="2" fill="#8C99A6"/><rect x="34" y="34" width="19" height="19" rx="2" fill="#EDEDF0"/></svg><div><b>مركز التحكم</b><small>MD SYSTEMS · CONTROL</small></div></div>
  <p class="muted" style="margin:0;text-align:center">منصة برامج ENG-MD-HUB</p>
  <input id="email" type="email" autocomplete="username" placeholder="البريد" dir="ltr">
  <input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" dir="ltr">
  <div class="err" id="loginErr"></div>
  <button class="btn primary" id="loginBtn">دخول</button>
</section>

<section class="auth" id="mfa" hidden>
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="8" fill="#1E1E22"/><rect x="11" y="11" width="19" height="19" rx="2" fill="#4E5A66"/><rect x="34" y="11" width="19" height="19" rx="2" fill="#8C99A6"/><rect x="11" y="34" width="19" height="19" rx="2" fill="#8C99A6"/><rect x="34" y="34" width="19" height="19" rx="2" fill="#EDEDF0"/></svg></div>
  <h1 id="mfaTitle"></h1>
  <p class="muted" id="mfaHelp" style="margin:0;text-align:center"></p>
  <img id="mfaQr" alt="رمز QR" hidden>
  <code id="mfaSecret" hidden dir="ltr"></code>
  <input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" dir="ltr">
  <div class="err" id="mfaErr"></div>
  <button class="btn primary" id="mfaBtn">تأكيد</button>
  <button class="btn" id="mfaOut">تسجيل الخروج</button>
</section>

<div class="wrap" id="app" hidden>
  <header class="topbar">
    <h1><a href="#/" class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="8" fill="#1E1E22"/><rect x="11" y="11" width="19" height="19" rx="2" fill="#4E5A66"/><rect x="34" y="11" width="19" height="19" rx="2" fill="#8C99A6"/><rect x="11" y="34" width="19" height="19" rx="2" fill="#8C99A6"/><rect x="34" y="34" width="19" height="19" rx="2" fill="#EDEDF0"/></svg><span><b>مركز التحكم</b><small>MD SYSTEMS · CONTROL</small></span></a></h1>
    <a class="btn" href="#/services" style="display:flex;align-items:center;color:var(--ink)">الخدمات والحدود</a>
    <button class="btn" id="refresh" title="تحديث" aria-label="تحديث">⟳</button>
    <button class="btn" id="menuBtn" aria-label="القائمة">⋯</button>
  </header>
  <main id="view"></main>
</div>

<dialog id="menuDlg"><form method="dialog" class="dlg">
  <button class="btn" type="button" id="addMfa">إضافة تطبيق مصادقة احتياطي</button>

function svcView(s){
  const today=Date.now();
  let used=s.used!=null?Number(s.used):null,max=s.max!=null?Number(s.max):null,unit=s.unit||"";
  let start=s.period_start?new Date(s.period_start).getTime():null,end=s.period_end?new Date(s.period_end).getTime():null;

  const pct=used!=null&&max?Math.min(100,Math.round(100*used/max)):null;
  const timePct=start&&end?Math.max(0,Math.min(100,Math.round(100*(today-start)/(end-start)))):null;
  const daysLeft=end?Math.ceil((end-today)/DAY):null;

  else if((pct!=null&&pct>=70)||(isTime&&daysLeft!=null&&daysLeft<soon[1]))lv="warn";

  const fill=isTime?(timePct??0):(pct??0);

  const rightTxt=isTime?(timePct!=null?`مضى ${timePct}% من المدة`:""):(pct!=null?`استُهلك ${pct}%`:"");

      <div class="chart"><div class="yax"><span>${top}</span><span>${top/2}</span><span>0</span></div>
        <div class="plot"><div class="grid"><i></i><i></i><i></i></div><div class="bars">${chart}</div></div></div>
      <div class="legend"><span><i class="sw" style="background:var(--blue)"></i>اليوم</span><span><i class="sw" style="background:var(--blue2)"></i>الأيام السابقة</span></div>
    </div>
    <div class="panel"><div class="ph"><h3>الخدمات التي يعتمد عليها</h3><a href="#/services">كل الخدمات</a></div>

      ${svcs.length?svcs.map(v=>svcRow(v,true)).join(""):`<span class="muted">لم تُربط خدمات بهذا البرنامج.</span>`}
    </div>
  </div>
  ${coPanel}
  ${accPanel}
  <div class="sec"><div class="ph"><h3 style="font-size:20px">المستخدمون وأجهزتهم</h3><span class="muted" style="font-size:13px">اضغط أي بطاقة لترى كل التفاصيل.</span></div>
  <div class="filters">${pill("all",`الكل (${fmt(list.length)})`)}${pill("a",`نشط (${fmt(k.a)})`,"a")}${pill("i",`غير نشط (${fmt(k.i)})`,"i")}${pill("s",`موقوف (${fmt(k.s)})`,"s")}</div>

// ---------- BGX (Windows): every PC, its license, and paid codes ----------
const isWin=d=>/win/i.test(d.platform||"")||d.app_id=="wallfit";
const bgxOf=id=>(D.bgxPcs||[]).find(x=>x.install_id==id);
function licOf(p){
  if(!p)return {k:"free",t:"غير مسجّل"};
  if(p.banned)return {k:"blocked",t:"موقوف"};
  if(p.code_plan)return {k:"pro",t:p.code_plan=="yearly"?"مدفوع · سنوي":"مدفوع · دائم"};
  if(p.license=="permanent")return {k:"pro",t:"دائم"};
  const left=t=>Math.ceil((new Date(t)-Date.now())/DAY);
  if(p.license=="trial"){const n=left(p.expires_at);return n>0?{k:"trial",t:`تجربة · باقي ${daysAr(n)}`}:{k:"free",t:"انتهت التجربة"}}
  if(p.license=="free")return {k:"free",t:"مجاني"};
  const n=p.trial_ends?left(p.trial_ends):0;
  return n>0?{k:"trial",t:`تجربة تلقائية · باقي ${daysAr(n)}`}:{k:"free",t:"مجاني · انتهت التجربة"};
}
const licChip=p=>{const l=licOf(p);return `<span class="lic ${l.k}">${esc(l.t)}</span>`};
function bgxPanel(){
  const pcs=D.bgxPcs||[],codes=D.bgxCodes||[],acts=D.bgxActs||[];
  const n={pro:0,trial:0,free:0,blocked:0};pcs.forEach(p=>n[licOf(p).k]++);
  const pcCards=pcs.map(p=>`<div class="pc">
    <div class="r"><div><b class="ltr">${esc(p.label||p.machine||"PC")}</b><div class="faint" style="font-size:12px">${esc(p.machine&&p.label?p.machine+" · ":"")}Windows ${esc(p.os||"-")} · <span class="ltr">v${esc(p.app_version||"-")}</span>${p.country?` · ${esc(p.country)}`:""}</div></div>${licChip(p)}</div>
    <span class="muted" style="font-size:12.5px">أول تشغيل ${date(p.first_seen)} · آخر ظهور ${ago(p.last_seen)}${p.note?` · ${esc(p.note)}`:""}</span>
    <div class="acts2">
      <button class="btn sm" data-bgx="permanent" data-id="${p.install_id}">دائم</button>
      <button class="btn sm" data-bgx="trial" data-id="${p.install_id}">تجربة بأيام…</button>
      <button class="btn sm" data-bgx="free" data-id="${p.install_id}">مجاني</button>
      <button class="btn sm" data-bgx="auto" data-id="${p.install_id}" title="يرجع لقاعدة التجربة التلقائية (أسبوع لكل جهاز)">تلقائي</button>
      <button class="btn sm" data-bgx="note" data-id="${p.install_id}">ملاحظة</button>
    </div></div>`).join("");
  const codeCards=codes.map(c=>{const dv=acts.filter(a=>a.code_id==c.id),on=c.status=="active";return `<div class="co ${on?"":"off"}">
    <div class="r"><div><b>${esc(c.label||"بدون اسم")}</b>${c.code?`<span class="code" style="margin-top:4px"><b>${esc(c.code)}</b><button data-bgxc="copy" data-code="${esc(c.code)}">نسخ</button></span>`:`<div class="faint ltr" style="font-size:11.5px;text-align:start">••••${esc(c.code_hint||"")}</div>`}</div><span class="chip">${on?`${dot("a")} فعّال`:`${dot("s")} موقوف`}</span></div>
    <span class="muted" style="font-size:13px">${c.plan=="yearly"?"سنوي":"دائم"} · الأجهزة ${fmt(dv.length)} من ${fmt(c.max_devices)}${c.expires_at?` · ينتهي ${date(c.expires_at)}`:""}</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-bgxc="rotate" data-id="${c.id}">تغيير الرمز</button><button class="btn sm ${on?"danger":""}" data-bgxc="${on?"stop":"resume"}" data-id="${c.id}">${on?"إيقاف":"استئناف"}</button><button class="btn sm" data-bgxc="del" data-id="${c.id}">حذف</button></div>
  </div>`}).join("");
  return `<div class="panel sec"><div class="ph"><h3>أجهزة BGX وتراخيصها</h3><span class="muted" style="font-size:13px">${fmt(pcs.length)} جهاز</span></div>
  <p class="sub">كل جهاز يفتح BGX يأخذ تجربة أسبوع تلقائياً، بعدها يصير مجانياً حتى تعطيه ترخيصاً. التغيير يصل للجهاز عند فتح البرنامج أو خلال 6 ساعات.</p>
  <div class="sum" style="margin:0"><div><span class="lic pro">مدفوع / دائم</span><b>${n.pro}</b></div><div><span class="lic trial">تجربة</span><b>${n.trial}</b></div><div><span class="lic free">مجاني</span><b>${n.free}</b></div>${n.blocked?`<div><span class="lic blocked">موقوف</span><b>${n.blocked}</b></div>`:""}</div>
  ${pcs.length?`<div class="pcs">${pcCards}</div>`:`<span class="muted">لم يفتح أحد BGX بعد.</span>`}</div>
  <div class="panel sec"><div class="ph"><h3>رموز تفعيل BGX Pro</h3><button class="btn sm" id="bgxNew">رمز جديد</button></div>
  <p class="sub">للبيع: كل رمز يفعّل النسخة الكاملة على عدد أجهزة تحدده.</p>
  ${codes.length?`<div class="cos">${codeCards}</div>`:`<span class="muted">لا رموز بعد.</span>`}</div>`;
}
$("view").addEventListener("click",async e=>{
  if(e.target.closest("#bgxNew")){
    const label=prompt("لمن هذا الرمز؟","");if(label===null)return;
    const max=Number(prompt("عدد الأجهزة المسموح","2"))||2;
    const yearly=confirm("سنوي؟ (موافق = سنوي، إلغاء = دائم)");
    const {data,error}=await db.rpc("owner_wallfit_create",{p_label:label.trim(),p_max:max,p_expires:null,p_plan:yearly?"yearly":"lifetime"});
    if(error){alert("لم تتم العملية: "+error.message);return}
    prompt("الرمز الجديد:",data.code);await load();return}
  const b=e.target.closest("[data-bgx]");
  if(b){
    const id=b.dataset.id,act=b.dataset.bgx,p=bgxOf(id);
    if(act=="note"){const v=prompt("ملاحظة على هذا الجهاز",p?.note||"");if(v===null)return;await rpc("owner_wallfit_grant",{p_install:id,p_kind:p?.license||"auto",p_days:p?.license=="trial"?Math.max(1,Math.ceil((new Date(p.expires_at)-Date.now())/DAY)):null,p_note:v});return}
    if(act=="trial"){const v=Number(prompt("كم يوم تجربة؟","14"));if(!v||v<1)return;await rpc("owner_wallfit_grant",{p_install:id,p_kind:"trial",p_days:Math.round(v),p_note:null});return}
    if(act=="free"&&!confirm("سحب النسخة الكاملة من هذا الجهاز؟"))return;
    await rpc("owner_wallfit_grant",{p_install:id,p_kind:act,p_days:null,p_note:null});return}
  const c=e.target.closest("[data-bgxc]");if(!c)return;
  const id=c.dataset.id,act=c.dataset.bgxc;
  if(act=="copy"){try{await navigator.clipboard.writeText(c.dataset.code);c.textContent="✓";setTimeout(()=>c.textContent="نسخ",1200)}catch{prompt("انسخ الرمز",c.dataset.code)}return}
  if(act=="rotate"){if(!confirm("تغيير الرمز؟ القديم يتوقف، والأجهزة المفعّلة تبقى."))return;const {data,error}=await db.rpc("owner_wallfit_rotate",{p_id:id});if(error){alert("لم تتم العملية: "+error.message);return}prompt("الرمز الجديد:",data.code);await load()}
  if(act=="stop"||act=="resume")await rpc("owner_wallfit_set",{p_id:id,p_status:act=="stop"?"revoked":"active"});
  if(act=="del"){if(!confirm("حذف الرمز نهائياً؟"))return;await rpc("owner_wallfit_delete",{p_id:id})}
});

function storaPanel(){

    <div class="r"><div><b>${esc(c.name)}</b><div class="faint ltr" style="font-size:11.5px;text-align:start">${esc(c.id)}</div></div><span class="chip">${c.active?`${dot("a")} نشطة`:`${dot("s")} معطّلة`}</span></div>

    ${c.note?`<span class="faint" style="font-size:12.5px">${esc(c.note)}</span>`:""}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-co="${esc(c.id)}" data-co-act="edit">تعديل</button><button class="btn sm" data-co="${esc(c.id)}" data-co-act="addcode">رمز جديد</button><button class="btn sm ${c.active?"danger":""}" data-co="${esc(c.id)}" data-co-act="toggle">${c.active?"تعطيل الشركة":"تفعيل الشركة"}</button></div>
  </div>`}).join("")}</div>`:`<span class="muted">لا شركات بعد.</span>`}</div>`;
}
const genCode=()=>{const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let r="";const b=crypto.getRandomValues(new Uint8Array(8));for(const x of b)r+=a[x%a.length];return r};
const CODE_RE=/^[A-Z0-9!@#$%&*\-_+=.?]{8}$/;
function openCo(c){
  $("coDlg").dataset.id=c?.id||"";$("coTitle").textContent=c?"تعديل الشركة":"شركة جديدة في STORA";
  $("fCoName").value=c?.name||"";$("fCoActive").checked=c?c.active:true;$("fCoNote").value=c?.note||"";
  $("fCoCodeL").hidden=!!c;$("fCoCode").value=c?"":genCode();$("coErr").textContent="";
  $("coDlg").showModal();
}
$("fCoGen").addEventListener("click",()=>{$("fCoCode").value=genCode()});
$("coOk").addEventListener("click",e=>{
  const code=$("fCoCode").value.trim().toUpperCase();
  if(!$("coDlg").dataset.id&&!CODE_RE.test(code)){e.preventDefault();$("coErr").textContent="الرمز 8 خانات: حروف إنجليزية أو أرقام أو رموز مثل - _ #"}
  if((D.storaCodes||[]).some(x=>x.code==code)&&!$("coDlg").dataset.id){e.preventDefault();$("coErr").textContent="هذا الرمز مستخدم"}
});
$("coDlg").addEventListener("close",async()=>{
  if($("coDlg").returnValue!="ok")return;
  const id=$("coDlg").dataset.id||null,code=$("fCoCode").value.trim().toUpperCase();
  const {data,error}=await db.rpc("owner_stora_save_company",{p_id:id,p_name:$("fCoName").value.trim(),p_active:$("fCoActive").checked,p_note:$("fCoNote").value.trim()||null});
  if(error){alert("لم تتم العملية: "+error.message);return}
  if(!id&&code)await rpc("owner_stora_set_code",{p_code:code,p_company:data,p_active:true});else await load();
});
$("view").addEventListener("click",async e=>{
  if(e.target.closest("#addCo")){openCo(null);return}
  const b=e.target.closest("[data-co-act]");if(!b)return;
  const act=b.dataset.coAct,co=(D.storaCos||[]).find(x=>x.id==b.dataset.co),cd=(D.storaCodes||[]).find(x=>x.code==b.dataset.code);
  if(act=="edit")openCo(co);
  if(act=="toggle"){if(co.active&&!confirm(`تعطيل ${co.name}؟ لن يستطيع مستخدموها الدخول إلى STORA حتى تعيد تفعيلها.`))return;await rpc("owner_stora_save_company",{p_id:co.id,p_name:co.name,p_active:!co.active,p_note:co.note})}
  if(act=="addcode"){const v=prompt("رمز الانضمام الجديد (8 خانات)",genCode());if(v===null)return;const code=v.trim().toUpperCase();if(!CODE_RE.test(code)){alert("الرمز 8 خانات: حروف إنجليزية أو أرقام أو رموز");return}await rpc("owner_stora_set_code",{p_code:code,p_company:co.id,p_active:true})}
  if(act=="codeoff"||act=="codeon")await rpc("owner_stora_set_code",{p_code:cd.code,p_company:cd.company_id,p_active:act=="codeon"});
  if(act=="copy"){try{await navigator.clipboard.writeText(cd.code);b.textContent="✓";setTimeout(()=>b.textContent="نسخ",1200)}catch{prompt("انسخ الرمز",cd.code)}}
});

  if(act=="copy"){try{await navigator.clipboard.writeText(b.dataset.code);b.textContent="✓";setTimeout(()=>b.textContent="نسخ",1200)}catch{prompt("انسخ الرمز",b.dataset.code)}return}
  if(act=="unlink"){if(!confirm("سحب النسخة الكاملة من هذا الجهاز؟ يرجع للمجانية عند فتح التطبيق."))return;await rpc("owner_coachpad_unlink",{p_id:id,p_install:b.dataset.dev})}
});

function viewServices(){
  const items=D.services.map(svcView);
  const groups=[...new Set(D.services.map(s=>s.provider))].map(p=>{const its=items.filter(v=>v.s.provider==p).sort((a,b)=>LVO[a.lv]-LVO[b.lv]);return {p,its,worst:Math.min(...its.map(v=>LVO[v.lv]))}}).sort((a,b)=>a.worst-b.worst);
  const n=l=>items.filter(v=>v.lv==l).length;
  return `<a class="crumb" href="#/">كل البرامج</a>
  <div class="ph"><h2>الخدمات والحدود المجانية</h2><button class="btn primary" id="addSvc">إضافة خدمة</button></div>
  <p class="lead">الحدود تخص <b>الخدمة</b> لا البرنامج: كل البرامج التي تستخدم نفس الخدمة تستهلك من نفس الحد. يصير السطر <b style="color:var(--red)">أحمر</b> عند الخطر.</p>
  <div class="sum"><div><b style="color:var(--red)">${n("danger")}</b>في خطر</div><div><b style="color:var(--amber)">${n("warn")}</b>تحتاج انتباه</div><div><b>${n("ok")}</b>بأمان</div></div>
  <div class="key"><span><i class="sw" style="background:var(--blue)"></i>آمن</span><span><i class="sw" style="background:var(--amber)"></i>70% فأكثر، أو أقل من 14 يوماً على الانتهاء</span><span><i class="sw" style="background:var(--red)"></i>90% فأكثر، أو أقل من 4 أيام</span><span><i class="sw" style="background:var(--ink);width:3px"></i>اليوم</span></div>
  ${groups.map(g=>`<div class="grp"><h3>${esc(g.p)}</h3>${g.its.map(v=>svcRow(v,false)).join("")}</div>`).join("")||`<div class="empty">لا خدمات بعد.</div>`}
  <p class="faint" style="font-size:12.5px">حجم قاعدة البيانات وبقاء المشروع نشطاً يُحسبان تلقائياً. باقي الأرقام تُحدَّث يدوياً بالضغط على السطر.</p>`;
}

function deviceDetails(id){
  const d=D.devices.find(x=>x.install_id==id);if(!d)return;
  const s=stateOf(d),sess=d.open_count?dur(Math.round(d.total_seconds/d.open_count)):"-";
  const wk=[];for(let i=6;i>=0;i--){const t=Date.now()-i*DAY,u=D.usage.find(x=>x.install_id==id&&x.day==dayKey(t));wk.push({v:Math.round((u?.app_seconds||0)/60),d:i==0?"اليوم":`${new Date(t).getDate()}/${new Date(t).getMonth()+1}`})}
  const mx=Math.max(1,...wk.map(w=>w.v));
  const evs=D.events.filter(e=>e.install_id==id).slice(0,6),err=D.errors[id],reason=D.reasons.find(r=>r.code==d.ban_reason_code);
  $("devBody").innerHTML=`<div class="dh"><div><h3>${dot(s)} ${esc(d.label||d.device_model||"جهاز")}</h3><span class="muted" style="font-size:13px">${esc(d.device_model||"")} · Android ${esc(d.android_version||"-")} · <span class="ltr">${esc(d.install_id.slice(0,8))}</span></span></div><button class="x" data-close aria-label="إغلاق">✕</button></div>
  <div class="nums" style="grid-template-columns:repeat(4,1fr)"><div><b>${ago(d.last_seen)}</b><span>آخر ظهور</span></div><div><b>${fmt(d.open_count)}</b><span>مرة فتح</span></div><div><b>${dur(d.read_seconds)}</b><span>مدة القراءة</span></div><div><b>${sess}</b><span>متوسط الجلسة</span></div></div>
  <div class="box"><h4>استخدامه في آخر 7 أيام (بالدقائق)</h4><div class="wk">${wk.map(w=>`<div><small>${w.v||""}</small><i style="height:${Math.max(2,Math.round(42*w.v/mx))}px"></i><small>${w.d}</small></div>`).join("")}</div></div>
  <div class="mg"><div class="box"><h4>النشاط</h4>
    <div class="kv"><span>مدة الاستخدام الكلية</span><span>${dur(d.total_seconds)}</span></div>
    <div class="kv"><span>قراءة داخل التطبيق</span><span>${dur(d.read_seconds)}</span></div>
    <div class="kv"><span>PDF خارجي</span><span>${dur(d.external_seconds)}</span></div>
    <div class="kv"><span>المكتبة</span><span>${fmt(d.library_books)} كتاب · ${size(d.library_bytes)}</span></div></div>
  <div class="box"><h4>الجهاز</h4>
    <div class="kv"><span>الدولة</span><span>${esc(d.ip_country||d.country||"-")}</span></div>
    <div class="kv"><span>المنطقة الزمنية</span><span class="ltr">${esc(d.timezone||"-")}</span></div>
    <div class="kv"><span>إصدار التطبيق</span><span class="ltr">${esc(d.app_version||"-")} (${esc(d.build_type||"-")})</span></div>
    <div class="kv"><span>أول ظهور</span><span>${date(d.first_seen)}</span></div>
    <div class="kv"><span>إعادات التثبيت</span><span>${fmt(d.reinstalls)}</span></div></div></div>
  <div class="mg"><div class="box"><h4>سجل الأحداث</h4>${evs.length?evs.map(e=>`<div class="ev"><i></i><div>${esc(EVENT_AR[e.kind]||e.kind)}<br><span class="muted" style="font-size:12.5px">${date(e.at)}</span></div></div>`).join(""):`<span class="muted">لا أحداث.</span>`}</div>
  <div class="box"><h4>آخر خطأ</h4>${err?`<span style="font-size:13.5px">${esc(String(err.detail?.message||"").slice(0,300))}</span><span class="muted" style="font-size:12.5px">${date(err.created_at)}</span>`:`<span class="muted">لا أخطاء.</span>`}</div></div>
  ${d.banned?`<p style="margin:0">${dot("s")} موقوف منذ ${date(d.banned_at)} · ${esc(reason?reason.ar:d.ban_reason_code||"")}${d.ban_note?` · <span class="muted">${esc(d.ban_note)}</span>`:""}</p>`:""}
  <div class="acts">${d.banned?`<button class="btn primary" data-act="resume">استئناف</button>`:`<button class="btn danger" data-act="stop">إيقاف هذا الجهاز</button>`}<button class="btn" data-act="name">تسمية الجهاز</button><button class="btn" data-act="del">حذف</button></div>`;
  $("devDlg").dataset.id=id;
  if(!$("devDlg").open)$("devDlg").showModal();
}

// ---------- routing and actions ----------
function route(){
  if($("app").hidden)return;
  const h=location.hash.replace(/^#\/?/,"").split("/");
  const v=h[0]=="app"?viewApp(decodeURIComponent(h[1]||"")):h[0]=="services"?viewServices():viewHome();
  $("view").innerHTML=v;
  if($("devDlg").open&&$("devDlg").dataset.id)deviceDetails($("devDlg").dataset.id);
}
const curApp=()=>decodeURIComponent((location.hash.match(/^#\/app\/([^/]+)/)||[])[1]||"");
addEventListener("hashchange",()=>{filter="all";route();scrollTo(0,0)});
async function rpc(fn,args){const {error}=await db.rpc(fn,args);if(error){alert("لم تتم العملية: "+error.message);return false}await load();return true}

$("view").addEventListener("click",e=>{
  const t=e.target;
  const f=t.closest("[data-filter]");if(f){filter=f.dataset.filter;route();return}
  const dv=t.closest("[data-dev]");if(dv){deviceDetails(dv.dataset.dev);return}
  const ac=t.closest("[data-acc]");if(ac){openAcc(D.accounts.find(x=>x.id==ac.dataset.acc));return}
  const sv=t.closest("[data-svc]");if(sv){openSvc(D.services.find(x=>x.id==sv.dataset.svc));return}
  if(t.closest("#addApp"))openApp(null);
  if(t.closest("#editApp"))openApp(D.apps.find(a=>a.id==curApp()));
  if(t.closest("#addAcc"))openAcc(null);
  if(t.closest("#addSvc"))openSvc(null);
  if(t.closest("#logoBtn"))$("logoFile").click();
  if(t.closest("#appStop"))openAppStop(t.closest("#appStop").dataset.stop=="1");
});
$("view").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.matches("[data-svc]"))e.target.click()});

// device dialog
$("devDlg").addEventListener("click",async e=>{
  if(e.target==$("devDlg")||e.target.closest("[data-close]")){$("devDlg").close();return}
  const b=e.target.closest("[data-act]");if(!b)return;const id=$("devDlg").dataset.id;
  if(b.dataset.act=="resume")await rpc("owner_set_ban",{p_install_id:id,p_banned:false,p_code:null,p_note:null});
  if(b.dataset.act=="name"){const v=prompt("اسم الجهاز",D.devices.find(x=>x.install_id==id)?.label||"");if(v!==null)await rpc("owner_set_label",{p_install_id:id,p_label:v})}
  if(b.dataset.act=="stop"){$("stopReason").innerHTML=D.reasons.map(r=>`<option value="${esc(r.code)}">${esc(r.ar)}</option>`).join("");$("stopNote").value="";$("stopDlg").showModal()}
  if(b.dataset.act=="del")$("delDlg").showModal();
});
$("devDlg").addEventListener("close",()=>{$("devDlg").dataset.id=""});
$("stopDlg").addEventListener("close",()=>{if($("stopDlg").returnValue=="ok")rpc("owner_set_ban",{p_install_id:$("devDlg").dataset.id,p_banned:true,p_code:$("stopReason").value,p_note:$("stopNote").value})});
$("delDlg").addEventListener("close",async()=>{if($("delDlg").returnValue!="ok")return;const id=$("devDlg").dataset.id;$("devDlg").close();await rpc("owner_delete_device",{p_install_id:id})});

// whole-app stop (type the name to confirm)
function openAppStop(stop){
  const a=D.apps.find(x=>x.id==curApp());if(!a)return;
  $("appStopDlg").dataset.stop=stop?"1":"0";
  $("appStopTitle").textContent=stop?`إيقاف ${a.name} لكل المستخدمين`:`استئناف ${a.name} لكل المستخدمين`;
  $("appStopHelp").textContent=stop?"كل جهاز يتصل بعد الآن سيتوقف ويرى الرسالة. الأجهزة غير المتصلة تتوقف عند أول اتصال.":"يعود التطبيق للعمل عند أول اتصال لكل جهاز.";
  $("appStopMsg").parentElement.hidden=!stop;$("appStopConfirmL").hidden=!stop;$("appStopConfirm").value="";$("appStopErr").textContent="";
  $("appStopOk").textContent=stop?"إيقاف للجميع":"استئناف";$("appStopOk").className=stop?"btn danger":"btn primary";
  $("appStopDlg").showModal();
}
$("appStopOk").addEventListener("click",e=>{
  const a=D.apps.find(x=>x.id==curApp());
  if($("appStopDlg").dataset.stop=="1"&&$("appStopConfirm").value.trim()!=a.name){e.preventDefault();$("appStopErr").textContent=`اكتب "${a.name}" كما هو للتأكيد.`}
});
$("appStopDlg").addEventListener("close",()=>{if($("appStopDlg").returnValue!="ok")return;rpc("owner_set_app_state",{p_id:curApp(),p_stopped:$("appStopDlg").dataset.stop=="1",p_message:$("appStopMsg").value})});

// add / edit app
function openApp(a){
  $("appDlgTitle").textContent=a?"تعديل البرنامج":"إضافة برنامج";
  $("fAppName").value=a?.name||"";$("fAppId").value=a?.id||"";$("fAppId").disabled=!!a;
  $("fAppPlat").value=(a?.platforms||[]).join(", ");$("fAppOnline").checked=a?a.online:true;$("fAppNote").value=a?.note||"";$("appErr").textContent="";
  $("appDlg").showModal();
}
$("appDlg").addEventListener("close",async()=>{
  if($("appDlg").returnValue!="ok")return;
  const id=$("fAppId").value.trim().toLowerCase();
  const ok=await rpc("owner_save_app",{p_id:id,p_name:$("fAppName").value.trim(),p_platforms:$("fAppPlat").value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean),p_online:$("fAppOnline").checked,p_note:$("fAppNote").value.trim()||null});
  if(ok&&!location.hash.startsWith("#/app/"))location.hash="#/app/"+encodeURIComponent(id);
});

// logo upload: resized in the browser, stored as a small image (no extra service).
$("logoFile").addEventListener("change",async()=>{
  const file=$("logoFile").files[0];$("logoFile").value="";if(!file)return;
  if(file.size>3*1048576){alert("الصورة كبيرة: الحد 3 MB.");return}
  const url=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});
  let out=url;
  if(file.type!="image/svg+xml"){
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const scale=Math.min(1,480/img.width,160/img.height),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/webp",0.9);
    if(!out.startsWith("data:image/webp"))out=c.toDataURL("image/png");
  }
  if(out.length>200000){alert("الشعار ما زال كبيراً بعد التصغير. جرّب صورة أبسط.");return}
  await rpc("owner_set_app_logo",{p_id:curApp(),p_logo:out});
});

// accounts
function openAcc(x){
  $("accDlg").dataset.id=x?.id||"";$("accTitle").textContent=x?"تعديل الحساب":"إضافة حساب";
  $("fAccSvc").value=x?.service||"";$("fAccRole").value=x?.role||"";$("fAccEmail").value=x?.email||"";$("fAccNote").value=x?.note||"";
  $("accDel").hidden=!x;$("accDlg").showModal();
}
$("accDlg").addEventListener("close",()=>{if($("accDlg").returnValue!="ok")return;const id=$("accDlg").dataset.id;
  rpc("owner_save_account",{p_id:id?Number(id):null,p_app:curApp(),p_service:$("fAccSvc").value.trim(),p_role:$("fAccRole").value.trim()||null,p_email:$("fAccEmail").value.trim()||null,p_note:$("fAccNote").value.trim()||null})});
$("accDel").onclick=()=>{if(!confirm("حذف هذا الحساب من القائمة؟"))return;const id=Number($("accDlg").dataset.id);$("accDlg").close();rpc("owner_delete_account",{p_id:id})};

// services
function openSvc(s){
  $("svcDlg").dataset.id=s?.id||"";
  $("fSvcProv").value=s?.provider||"";$("fSvcFeat").value=s?.feature||"";$("fSvcKind").value=s?.kind||"usage";
  $("fSvcUsed").value=s?.used??"";$("fSvcMax").value=s?.max??"";$("fSvcUnit").value=s?.unit||"";
  $("fSvcApps").value=(s?.apps||[]).join(", ");$("fSvcStart").value=s?.period_start||"";$("fSvcEnd").value=s?.period_end||"";$("fSvcNote").value=s?.note||"";
  $("fSvcUsed").disabled=s?.auto=="db_size";$("svcDel").hidden=!s;$("svcDlg").showModal();
}
$("svcDlg").addEventListener("close",()=>{if($("svcDlg").returnValue!="ok")return;const id=$("svcDlg").dataset.id,n=v=>v===""?null:Number(v);
  rpc("owner_save_service",{p_id:id?Number(id):null,p_provider:$("fSvcProv").value.trim(),p_feature:$("fSvcFeat").value.trim(),p_kind:$("fSvcKind").value,
    p_used:n($("fSvcUsed").value),p_max:n($("fSvcMax").value),p_unit:$("fSvcUnit").value.trim()||null,p_start:$("fSvcStart").value||null,p_end:$("fSvcEnd").value||null,
    p_apps:$("fSvcApps").value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean),p_note:$("fSvcNote").value.trim()||null})});
$("svcDel").onclick=()=>{if(!confirm("حذف هذه الخدمة من القائمة؟"))return;const id=Number($("svcDlg").dataset.id);$("svcDlg").close();rpc("owner_delete_service",{p_id:id})};

$("refresh").onclick=load;

// ---------- auth + two-step sign-in ----------
let mfa={mode:null,factorId:null};
function screen(name){["login","mfa","app"].forEach(s=>$(s).hidden=s!=name)}
function showMfa(mode,qr,secret){
  mfa.mode=mode;screen("mfa");
  $("mfaTitle").textContent=mode=="enroll"?"تفعيل التحقق بخطوتين":"التحقق بخطوتين";
  $("mfaHelp").textContent=mode=="enroll"?"امسح الرمز بتطبيق مصادقة ثم اكتب الرمز المكوّن من 6 أرقام.":"اكتب الرمز المكوّن من 6 أرقام من تطبيق المصادقة.";
  $("mfaQr").hidden=!qr;if(qr)$("mfaQr").src=qr;
  $("mfaSecret").hidden=!secret;$("mfaSecret").textContent=secret||"";
  $("mfaCode").value="";$("mfaErr").textContent="";$("mfaCode").focus();
}
async function startEnroll(){
  const {data:list}=await db.auth.mfa.listFactors();
  for(const f of (list?.all||[]))if(f.status!="verified")await db.auth.mfa.unenroll({factorId:f.id});
  const {data,error}=await db.auth.mfa.enroll({factorType:"totp",friendlyName:"Authenticator "+new Date().toISOString().slice(0,16)});
  if(error){alert(error.message);return}
  mfa.factorId=data.id;showMfa("enroll",data.totp.qr_code,data.totp.secret);
}
$("mfaBtn").onclick=async()=>{
  const code=$("mfaCode").value.trim();
  if(!/^\d{6}$/.test(code)){$("mfaErr").textContent="اكتب 6 أرقام.";return}
  const {error}=await db.auth.mfa.challengeAndVerify({factorId:mfa.factorId,code});
  if(error){$("mfaErr").textContent="الرمز خاطئ أو منتهٍ. حاول مرة أخرى.";return}
  if(mfa.mode=="enroll")alert("تم تسجيل تطبيق المصادقة.");
  mfa.mode=null;start();
};
$("mfaCode").addEventListener("keydown",e=>{if(e.key=="Enter")$("mfaBtn").click()});
$("mfaOut").onclick=$("signOut").onclick=async()=>{$("menuDlg").close();await db.auth.signOut();start()};
$("addMfa").onclick=()=>{$("menuDlg").close();startEnroll()};
$("menuBtn").onclick=()=>$("menuDlg").showModal();
$("chgPw").onclick=async()=>{
  $("menuDlg").close();
  const cur=prompt("كلمة المرور الحالية");if(!cur)return;
  const p=prompt("كلمة مرور جديدة (12 حرفاً فأكثر)");if(!p)return;
  if(p.length<12){alert("قصيرة: 12 حرفاً على الأقل.");return}
  const {error}=await db.auth.updateUser({password:p,current_password:cur});alert(error?error.message:"تم تغيير كلمة المرور.");
};
$("loginBtn").onclick=async()=>{
  $("loginErr").textContent="";
  const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error){$("loginErr").textContent="البريد أو كلمة المرور غير صحيحة.";return}
  start();
};
$("password").addEventListener("keydown",e=>{if(e.key=="Enter")$("loginBtn").click()});

async function start(){
  const {data}=await db.auth.getSession();
  if(!data.session){screen("login");return}
  const {data:aal}=await db.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal?.nextLevel=="aal2"&&aal?.currentLevel!="aal2"){
    const {data:list}=await db.auth.mfa.listFactors();mfa.factorId=list?.totp?.[0]?.id;showMfa("check");return;
  }
  if(aal?.nextLevel!="aal2"){startEnroll();return}
  screen("app");load();
}
start();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
setInterval(()=>{if(!$("app").hidden&&document.visibilityState=="visible"&&!document.querySelector("dialog[open]"))load()},60000);
</script>
